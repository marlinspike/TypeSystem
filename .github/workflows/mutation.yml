name: Mutation

# Regenerates the mutation evidence (ADR-0070): every catalogued defect in a
# security mechanism is applied, the tree is rebuilt with `tsc -b --force`,
# and the tests the catalog names must fail. The evidence record is uploaded
# as an artifact; a survivor, a stale entry or an unrun mutation fails the job.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  # Every pull request: a change to guarded code or to the tests that kill
  # its mutations matters as much as a change to the catalog (P3-M5).
  pull_request:

jobs:
  mutation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: typesys
          POSTGRES_PASSWORD: typesys
          POSTGRES_DB: typesys_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://typesys:typesys@localhost:5432/typesys_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:postgres
      - run: npm run mutation -- --out mutation-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-evidence
          path: mutation-evidence.json
