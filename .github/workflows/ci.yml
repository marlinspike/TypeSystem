name: CI

# A change touching only docs/, README.md, llms.txt, or package READMEs skips
# CI; any other file in the same push or PR still triggers it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "packages/*/README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "packages/*/README.md"

jobs:
  # Runs first, without Postgres: proves the default in-memory path — the one every
  # new/small project actually uses — works with zero external infrastructure.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:postgres
      - run: npm test
      - name: MCP smoke test (real stdio subprocess)
        run: npm run smoke:mcp
      - name: MCP smoke test (real HTTP transport)
        run: npm run smoke:mcp-http

  # A second job, with real Postgres and Redis service containers: proves the same
  # suite passes against @typesys/registry-store-postgres, @typesys/adapter-postgres,
  # and @typesys/redis instead of skipping those tests, including the multi-instance
  # tests (docs/how-to/use-postgres.md, docs/how-to/run-multiple-instances.md).
  test-with-postgres-and-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: typesys
          POSTGRES_PASSWORD: typesys
          POSTGRES_DB: typesys_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://typesys:typesys@localhost:5432/typesys_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:postgres
      - run: npm test
      # Two server processes sharing Redis, under concurrent load with a per-identity limit: fails
      # on any unexpected error, or if the instances admit more than one shared rate-limit budget.
      - name: Multi-instance load test (2 processes, shared Redis)
        run: npm run load-test
        env:
          LOAD_DURATION_S: "5"
          RATE_LIMIT_CAPACITY: "200"
          RATE_LIMIT_REFILL_PER_SECOND: "50"
