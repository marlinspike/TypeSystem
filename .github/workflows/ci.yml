name: CI

# Lean on purpose: everything that runs on GitHub for a pull request totals a
# few minutes. One job, cached dependencies, no service containers: install,
# lint, typecheck, build and the suite, whose Postgres, Redis and KMS tests
# skip without those services. Everything else runs locally: `npm run
# check:full` with Postgres and Redis (the database-backed tests, the demos,
# the MCP smoke and conformance runs, the load test) and `npm run mutation`.
# Mutation and Release are workflows started by hand only. A change touching
# only docs/, README.md, llms.txt, or package READMEs skips CI.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "packages/*/README.md"

# A newer push to the same pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:install
      - run: npm run lint
      - run: npm run check:terminology
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
