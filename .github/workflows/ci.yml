name: CI

# Everything that runs on GitHub for a pull request totals 4-5 minutes at
# most, preferably less. Anything longer runs locally (`npm run mutation`) or
# is an optional workflow someone starts by hand. A change touching only
# docs/, README.md, llms.txt, or package READMEs skips CI.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "packages/*/README.md"

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, with real Postgres, Redis and a local-kms emulator: the suite runs
  # once against @typesys/registry-store-postgres, @typesys/adapter-postgres,
  # @typesys/redis and @typesys/kms-aws instead of skipping those tests. The
  # zero-infrastructure path (the same suite with those tests skipping) is
  # run locally with `npm test`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: typesys
          POSTGRES_PASSWORD: typesys
          POSTGRES_DB: typesys_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kms:
        image: nsmithuk/local-kms:3.11.7
        ports:
          - 8080:8080
    env:
      DATABASE_URL: postgresql://typesys:typesys@localhost:5432/typesys_ci
      REDIS_URL: redis://localhost:6379
      KMS_ENDPOINT: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:install
      - run: npm run lint
      - run: npm run check:terminology
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:postgres
      - run: npm test
      - name: Drafting demonstration (a mission from words, replayed, scaffolded and verified)
        run: npm run draft:demo
      - name: MCP smoke test (real stdio subprocess)
        run: npm run smoke:mcp
      - name: MCP smoke test (real HTTP transport)
        run: npm run smoke:mcp-http
      # The official MCP conformance suite against the HTTP server, with known failures listed and explained
      # in scripts/mcp-conformance-baseline.yml: a new failure or a stale entry fails the build (ADR-0051).
      - name: MCP conformance (official suite, baselined)
        run: npm run conformance:mcp
      # Onboarding (ADR-0076) end to end: a real PostgreSQL schema and the crew roster service,
      # the recorded agent-mode answer, the committed review, live checks, and an incremental rerun.
      - name: Onboarding demonstration
        run: npm run onboard:demo
      # Two server processes sharing Redis, under concurrent load with a per-identity limit: fails
      # on any unexpected error, or if the instances admit more than one shared rate-limit budget.
      - name: Multi-instance load test (2 processes, shared Redis)
        run: npm run load-test
        env:
          LOAD_DURATION_S: "5"
          RATE_LIMIT_CAPACITY: "200"
          RATE_LIMIT_REFILL_PER_SECOND: "50"
