# Reference load balancer in front of the scaled `app` replicas (ADR-0029).
#
# Uses Docker Compose's embedded DNS (127.0.0.11) as a resolver and a variable upstream, so
# nginx re-resolves the `app` service name and spreads requests across every replica rather
# than pinning to the one IP it saw at startup. A real deployment would use a purpose-built
# load balancer or an ingress controller instead.

resolver 127.0.0.11 valid=10s;

server {
  listen 8080;

  location / {
    set $upstream http://app:3939;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
