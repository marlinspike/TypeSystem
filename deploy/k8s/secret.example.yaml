# EXAMPLE ONLY — do not commit real secret values. Copy this, fill in real values, and apply it
# out-of-band, or (preferred) create the Secret from the CLI so nothing sensitive is written to a file:
#
#   kubectl create secret generic typesys-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=REDIS_URL='redis://host:6379'
#
# Real secrets management — a secret store and a rotation story — is PRODUCTION-READINESS item #6,
# NOT solved by this file. The placeholders below are obviously not real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: typesys-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://typesys:REPLACE_ME@postgres:5432/typesys"
  REDIS_URL: "redis://redis:6379"
