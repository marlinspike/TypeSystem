# Reference Kubernetes manifests for the TypeSys MCP server (ADR-0025, ADR-0029).
#
# Flat YAML on purpose — tool-agnostic and readable. A real deployment would template these
# (Helm/Kustomize), pin the image by digest, and add resource requests/limits, a
# PodDisruptionBudget, and an HPA. Apply with:  kubectl apply -f deploy/k8s/
#
# Before applying: replace REGISTRY/typesys-mcp-server:TAG with your built-and-pushed image,
# create the Secret named `typesys-secrets` out-of-band (see secret.example.yaml) — never commit
# real secret values — and create the deployment file's ConfigMap (ADR-0102):
#
#   kubectl create configmap typesys-deployment --from-file=deployment.json=deployments/airforce-durable.deployment.json
#
# That deployment declares its state (ADR-0106): audit and workflow journal in Postgres
# (DATABASE_URL), cache and rate limit in Redis (REDIS_URL), so the two replicas below share
# them, and each writes its own audit chain. Run the migrate Job first; a replica refuses to
# start against a database without the tables. A real deployment (not "demo": true) must also
# sign its audit checkpoints: `npx typesys audit keygen --key-id audit-1 --out-dir .` prints the public key
# for state.audit.verifyKeys and writes the private key you put in the Secret as
# AUDIT_SIGNING_KEY (see secret.example.yaml). `typesys audit verify deployment.json` checks
# the trail; `typesys audit prune` (for example from a CronJob) enforces state.audit.retainDays.
#
# The image is the generic server; what it serves is that file. An upgrade is a new file (check it
# first with `typesys deploy check`, ADR-0104) or a new image, then `kubectl rollout restart
# deployment/typesys-mcp-server`. GET /version on any replica names the build it serves (ADR-0101).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: typesys-config
data:
  PORT: "3939"
  # Host names the MCP endpoint answers to (ADR-0053): the server refuses any other Host, against DNS rebinding.
  # List the name clients reach it by (your Ingress host), and the Service name for in-cluster clients.
  MCP_ALLOWED_HOSTS: "localhost,typesys-mcp-server"
  # The deployment the generic server builds (ADR-0102), mounted from the typesys-deployment ConfigMap below.
  TYPESYS_DEPLOYMENT: "/etc/typesys/deployment.json"
  TYPESYS_PACKS_DIR: "/app/packs"
---
# Runs the advisory-lock-safe migrations (ADR-0025) once before/independently of the rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: typesys-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: REGISTRY/typesys-mcp-server:TAG
          command: ["npm", "run", "migrate:postgres"]
          envFrom:
            - secretRef:
                name: typesys-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: typesys-mcp-server
  labels:
    app: typesys-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: typesys-mcp-server
  template:
    metadata:
      labels:
        app: typesys-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: REGISTRY/typesys-mcp-server:TAG
          ports:
            - containerPort: 3939
          envFrom:
            - configMapRef:
                name: typesys-config
            - secretRef:
                name: typesys-secrets
          volumeMounts:
            - name: deployment
              mountPath: /etc/typesys
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3939
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3939
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: deployment
          configMap:
            name: typesys-deployment
---
apiVersion: v1
kind: Service
metadata:
  name: typesys-mcp-server
spec:
  selector:
    app: typesys-mcp-server
  ports:
    - port: 80
      targetPort: 3939
