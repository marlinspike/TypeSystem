# Reference multi-replica topology for the TypeS MCP server (ADR-0025, ADR-0029).
#
#   docker compose up --build --scale app=2
#
# stands up Postgres, Redis, a one-shot migration, N app replicas, and an nginx load
# balancer in front of them (reach the server at http://localhost:8080/mcp, health at
# /healthz and /readyz).
#
# HONEST NOTE: the shipped demo server (packages/demo-web/dist/mcp-http.js) uses the in-memory airforce testbed,
# so it does not itself read Postgres or Redis. Those services, and the `migrate` step,
# are the infrastructure a REAL domain build wires in (a Postgres RegistryStore/adapter and
# the shared RedisCache/RedisRateLimiter — ADR-0025); `npm run load-test` is what actually
# exercises the shared-Redis path across replicas. They are included here so the topology
# and the migration deploy-step are demonstrable end to end.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: typesys
      POSTGRES_PASSWORD: typesys
      POSTGRES_DB: typesys
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typesys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the advisory-lock-safe migrations (ADR-0025) to completion before the app starts.
  migrate:
    build: .
    command: ["npm", "run", "migrate:postgres"]
    environment:
      DATABASE_URL: postgresql://typesys:typesys@postgres:5432/typesys
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      PORT: "3939"
      DATABASE_URL: postgresql://typesys:typesys@postgres:5432/typesys
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Scale out with: docker compose up --build --scale app=3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
