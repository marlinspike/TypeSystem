# Reference multi-replica topology for the TypeSystem server (ADR-0025, ADR-0029), serving the airforce
# demonstration. For your own deployment, `npx typesys deploy package <deployment.json> --target compose`
# writes a project like this one for it (ADR-0119).
#
#   docker compose up --build --scale app=2
#
# stands up Postgres, Redis, a one-shot migration, N app replicas, and an nginx load
# balancer in front of them (reach the server at http://localhost:8080/mcp, health at
# /healthz and /readyz).
#
# The replicas serve deployments/airforce-durable.deployment.json (ADR-0106): the airforce
# demonstration with its state declared, so every replica writes its audit trail, as its own
# hash chain, to Postgres, runs workflows on the Postgres journal, and shares one Redis cache
# and one rate limit. `migrate` creates the tables first; the server refuses to start without
# them. Check the trail every replica wrote with
#
#   docker compose run --rm app node packages/cli/dist/bin.js audit verify deployments/airforce-durable.deployment.json
#
# The demonstration's checkpoints are not signed. A real deployment signs them: make a key with
# `npx typesys audit keygen --key-id audit-1 --out-dir .`, give the private key to the app as a secret and put
# the public key in the deployment's state.audit.verifyKeys (ADR-0105).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: typesys
      POSTGRES_PASSWORD: typesys
      POSTGRES_DB: typesys
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typesys"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates or updates the tables the deployment's state section names (ADR-0117), before the app starts.
  migrate:
    build: .
    command: ["node", "packages/host/dist/serve.js", "migrate"]
    environment:
      TYPESYS_DEPLOYMENT: deployments/airforce-durable.deployment.json
      DATABASE_URL: postgresql://typesys:typesys@postgres:5432/typesys
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      PORT: "3939"
      TYPESYS_DEPLOYMENT: deployments/airforce-durable.deployment.json
      DATABASE_URL: postgresql://typesys:typesys@postgres:5432/typesys
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Scale out with: docker compose up --build --scale app=3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
